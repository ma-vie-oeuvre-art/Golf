<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection de balles de golf</title>
<style>
:root{
  --fond:#101208; --texte:#f3f0e7; --doux:#a49e90; --trait:#282b21; --accent:#c9a227;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fond);color:var(--texte);
  font:16px/1.55 ui-serif,Georgia,"Times New Roman",serif;
  padding:36px 20px 90px;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{font:500 11px/1 ui-sans-serif,system-ui;letter-spacing:.18em;
  text-transform:uppercase;color:var(--doux);margin-bottom:10px}
h1{font-size:36px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px}
.sous{color:var(--doux);font-size:15px;margin-bottom:28px}
.jauge{font:500 12px/1 ui-sans-serif,system-ui;letter-spacing:.05em;
  color:var(--doux);border-top:1px solid var(--trait);
  border-bottom:1px solid var(--trait);padding:13px 0;margin-bottom:34px}
.jauge b{color:var(--texte);font-weight:600}

/* ---- le carton ---- */
.carton{position:relative;border-radius:14px;padding:26px 24px 30px;
  background:
    radial-gradient(120% 90% at 50% -10%,#e2cda9,#c4ac83 55%,#ab936c 100%);
  box-shadow:0 24px 55px #000a, inset 0 2px 0 #fff8, inset 0 -3px 8px #6c5a3d55;
  display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.carton::before{content:"";position:absolute;left:24px;right:24px;top:50%;
  height:3px;transform:translateY(-50%);
  background:linear-gradient(#00000018,#00000030);border-radius:2px}
.alv{aspect-ratio:1;position:relative;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:transform .14s ease}
.alv:hover{transform:translateY(-4px)}
.alv.vide{cursor:default}.alv.vide:hover{transform:none}
.creux{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#93805c,#b09873 62%,#c9b189 78%,#0000 79%);
  box-shadow:inset 0 6px 12px #4d3f2a66}
.balle{position:relative;width:80%;filter:drop-shadow(0 6px 9px #00000055)}
.cellnum{position:absolute;top:-3px;left:1px;font:600 9px/1 ui-sans-serif,system-ui;
  color:#7a6844;letter-spacing:.04em}
.halo{position:absolute;inset:6%;border-radius:50%;
  border:1.5px solid var(--accent);opacity:.8;pointer-events:none}

/* ---- liste ---- */
.liste{margin-top:48px;border-top:1px solid var(--trait)}
.ligne{display:grid;grid-template-columns:36px 1fr auto;gap:16px;
  padding:15px 4px;border-bottom:1px solid var(--trait);cursor:pointer;
  align-items:baseline}
.ligne:hover{background:#ffffff09}
.ligne .c{color:var(--doux);font:600 12px/1.4 ui-sans-serif,system-ui}
.ligne .n{font-size:16.5px}
.ligne .m{display:block;color:var(--doux);font-size:13px;margin-top:3px}
.ligne .v{color:var(--doux);font:500 13px/1 ui-sans-serif,system-ui;white-space:nowrap}
.pastille{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--accent);margin-right:7px;vertical-align:2px}

/* ---- fiche ---- */
.voile{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.voile.on{display:flex}
.fiche{background:#191c15;border:1px solid var(--trait);border-radius:14px;
  max-width:560px;width:100%;padding:30px;max-height:86vh;overflow:auto;
  display:grid;grid-template-columns:110px 1fr;gap:0 24px}
.fiche .portrait{grid-row:span 2}
.fiche .portrait svg{width:100%}
.fiche h2{font-size:22px;margin-bottom:3px}
.fiche .adr{font:500 11px/1 ui-sans-serif,system-ui;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.fiche dl{grid-column:2;display:grid;grid-template-columns:110px 1fr;
  gap:7px 16px;font-size:14px}
.fiche dt{color:var(--doux);font:500 12px/1.5 ui-sans-serif,system-ui}
.fiche .note{grid-column:1/-1;margin-top:20px;padding-top:16px;
  border-top:1px solid var(--trait);font-size:14px;color:#dcd7cb}
.fiche button{grid-column:1/-1;justify-self:start;margin-top:22px;background:none;
  border:1px solid var(--trait);color:var(--doux);padding:8px 16px;border-radius:6px;
  cursor:pointer;font:500 13px ui-sans-serif,system-ui}
.fiche button:hover{color:var(--texte);border-color:var(--doux)}
footer{margin-top:60px;color:var(--doux);font-size:12px;
  font-family:ui-sans-serif,system-ui;line-height:1.7}
@media(max-width:640px){
  .carton{grid-template-columns:repeat(3,1fr)}
  .carton::before{display:none}
  h1{font-size:27px}
  .fiche{grid-template-columns:1fr}
  .fiche .portrait{width:120px;margin-bottom:14px}
  .fiche dl{grid-column:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1>Collection de balles de golf</h1>
  <p class="sous">Carton C-01 — premier contenant inventorié</p>
  <div class="jauge" id="jauge"></div>
  <div class="carton" id="carton"></div>
  <div class="liste" id="liste"></div>
  <footer id="pied"></footer>
</div>
<div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>

<script>
const BALLES = /*__DONNEES__*/[{"cel": 1, "k": "Buffalo Bills — logo seul", "ma": "Fabricant inconnu", "md": "—", "nat": "Pièce de collection", "num": "", "col": "Blanche", "et": "Très bon (AAAA)", "mq": "Logo Buffalo Bills (bison bleu, barre rouge) — aucun texte", "em": "Buffalo Bills", "val": 0, "src": "— aucune", "no": "Seule balle du carton dont le FABRICANT est inconnu : le logo occupe la face et aucune marque n'apparaît sur la portion photographiée. Tourner la balle devrait résoudre ça en dix secondes.", "bac": "C-01", "cap": 12}, {"cel": 2, "k": "Titleist Velocity — verte 22", "ma": "Titleist", "md": "Titleist Velocity", "nat": "Balle de jeu", "num": "22", "col": "Verte", "et": "Très bon (AAAA)", "mq": "", "em": "", "val": 1, "src": "⚙️ Barème", "no": "Le numéro 22 à deux chiffres est la signature de la gamme Velocity : c'est lui qui a permis d'identifier le modèle.", "bac": "C-01", "cap": 12}, {"cel": 3, "k": "Callaway Chrome Soft — blanche 1", "ma": "Callaway", "md": "Callaway Chrome Soft", "nat": "Balle de jeu", "num": "1", "col": "Blanche", "et": "Bon (AAA)", "mq": "", "em": "", "val": 1.5, "src": "⚙️ Barème", "no": "", "bac": "C-01", "cap": 12}, {"cel": 4, "k": "Kirkland Signature Performance+ — 1", "ma": "Kirkland Signature", "md": "Kirkland Signature Performance+", "nat": "Balle de jeu", "num": "1", "col": "Blanche", "et": "Bon (AAA)", "mq": "", "em": "", "val": 1.5, "src": "⚙️ Barème", "no": "", "bac": "C-01", "cap": 12}, {"cel": 5, "k": "Noodle — Golf Le Château Montebello", "ma": "TaylorMade", "md": "TaylorMade Noodle", "nat": "Pièce de collection", "num": "1", "col": "Blanche", "et": "Correct (AA)", "mq": "Golf Le Château MONTEBELLO", "em": "Club de golf Fairmont Le Château Montebello", "val": 0.5, "src": "⚠️ Barème sur balle marquée", "no": "Balle promotionnelle d'un parcours Stanley Thompson resté strictement privé jusqu'en 1970.", "bac": "C-01", "cap": 12}, {"cel": 6, "k": "Callaway — Angus Glen Golf Club", "ma": "Callaway", "md": "Modèle non déterminé", "nat": "Pièce de collection", "num": "4", "col": "Blanche", "et": "Correct (AA)", "mq": "ANGUS GLEN GOLF CLUB", "em": "Angus Glen Golf Club", "val": 0, "src": "— aucune", "no": "Marque lue (Callaway), MODÈLE NON DÉTERMINÉ : le logo du club occupe le côté où le nom du modèle s'imprime normalement. Parcours hôte des Omniums canadiens 2002 et 2007.", "bac": "C-01", "cap": 12}, {"cel": 7, "k": "Srixon Soft Feel — 3", "ma": "Srixon", "md": "Srixon Soft Feel", "nat": "Balle de jeu", "num": "3", "col": "Blanche", "et": "Correct (AA)", "mq": "", "em": "", "val": 0.5, "src": "⚙️ Barème", "no": "Ne pas confondre avec la Z-Star XV de la cellule 9 : même logo SRIXON de face, gammes opposées. C'est la mention latérale qui tranche.", "bac": "C-01", "cap": 12}, {"cel": 8, "k": "Callaway Chrome Soft — jaune Triple Track 3", "ma": "Callaway", "md": "Callaway Chrome Soft", "nat": "Balle de jeu", "num": "3", "col": "Jaune", "et": "Bon (AAA)", "mq": "Triple Track (trois lignes bleues, une rouge) — marquage d'alignement d'usine", "em": "", "val": 1.5, "src": "⚙️ Barème", "no": "MÊME FICHE MODÈLE QUE LA CELLULE 3 : le Triple Track est un marquage d'usine, pas un modèle distinct.", "bac": "C-01", "cap": 12}, {"cel": 9, "k": "Srixon Z-Star XV — 1", "ma": "Srixon", "md": "Srixon Z-Star XV", "nat": "Balle de jeu", "num": "1", "col": "Blanche", "et": "Correct (AA)", "mq": "", "em": "", "val": 1, "src": "⚙️ Barème", "no": "Balle la plus haut de gamme du carton avec la TP5x. Couverture uréthane : elle s'entaille là où une Soft Feel glisserait.", "bac": "C-01", "cap": 12}, {"cel": 10, "k": "Spalding — 4 rouge, sans modèle", "ma": "Spalding", "md": "Spalding (modèle non nommé)", "nat": "Pièce de collection", "num": "4", "col": "Blanche", "et": "Très bon (AAAA)", "mq": "", "em": "", "val": 0.35, "src": "⚙️ Barème", "no": "Seule marque disparue du carton, donc seul stock définitivement figé, et aucun nom de modèle. C'est la balle la plus intéressante du carton et celle sur laquelle on sait le moins.", "bac": "C-01", "cap": 12}, {"cel": 11, "k": "Vice Tour — 4", "ma": "Vice Golf", "md": "Vice Tour", "nat": "Balle de jeu", "num": "4", "col": "Blanche", "et": "Correct (AA)", "mq": "", "em": "", "val": 0.5, "src": "⚙️ Barème", "no": "Vendue uniquement en direct par la marque : cet exemplaire n'a jamais transité par un magasin de golf.", "bac": "C-01", "cap": 12}, {"cel": 12, "k": "TaylorMade TP5x — 1", "ma": "TaylorMade", "md": "TaylorMade TP5x", "nat": "Balle de jeu", "num": "1", "col": "Blanche", "et": "Correct (AA)", "mq": "", "em": "", "val": 1, "src": "⚙️ Barème", "no": "Cinq couches, la construction la plus complexe du carton. Vérifier la présence du « x » : la TP5 sans x est un autre modèle.", "bac": "C-01", "cap": 12}]/*__FIN__*/;
const CAPACITE = 12;

/* Teintes réelles ------------------------------------------------------- */
const TEINTES = {
  "Blanche":["#ffffff","#dcdad1"], "Jaune":["#f7e34e","#d9c02e"],
  "Verte":["#79d98b","#4fae62"],   "Orange":["#f7a75a","#dd8232"],
  "Rose":["#f7a3c0","#dd7ea2"],    "Rouge":["#ec7263","#cf4f3f"]
};

/* Jaunissement et usure selon l'état ------------------------------------ */
const ETATS = {
  "Neuve sous emballage":{j:0,   scuff:0, cut:0, lustre:.55},
  "Comme neuve (AAAAA)": {j:.03, scuff:0, cut:0, lustre:.48},
  "Très bon (AAAA)":     {j:.08, scuff:1, cut:0, lustre:.40},
  "Bon (AAA)":           {j:.15, scuff:2, cut:0, lustre:.32},
  "Correct (AA)":        {j:.24, scuff:3, cut:1, lustre:.24},
  "Usagée (A)":          {j:.35, scuff:4, cut:2, lustre:.16},
  "Endommagée":          {j:.44, scuff:5, cut:4, lustre:.10}
};

function melange(hex,t,vers){ // vers l'ivoire jauni
  const c=hex.replace('#',''),
    r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16),
    v=vers||[226,206,158], m=(x,y)=>Math.round(x+(y-x)*t);
  return `rgb(${m(r,v[0])},${m(g,v[1])},${m(b,v[2])})`;
}
function alea(seed){ let s=seed; return ()=>{s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff;}; }

/* Alvéolage : projection sphérique réelle -------------------------------- */
/* Une alvéole à l'angle θ du centre se projette au rayon R·sinθ et
   s'aplatit radialement d'un facteur cosθ. C'est ce raccourci qui donne
   le volume — une grille plate ferait un disque, pas une sphère.        */
function alveoles(R,cx,cy){
  const out=[], anneaux=[[0,1],[1,6],[2,12],[3,18],[4,24],[5,26]];
  const dTheta=Math.PI/2/6.15;
  anneaux.forEach(([i,n])=>{
    const th=i*dTheta, rr=R*Math.sin(th), fore=Math.cos(th);
    for(let k=0;k<n;k++){
      const a=(k/n)*Math.PI*2+(i%2?Math.PI/n:0);
      const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
      out.push({x,y,rx:R*.052*fore,ry:R*.052,rot:a*180/Math.PI,fore:fore});
    }
  });
  return out;
}

function dessinerBalle(b,taille){
  const id='b'+b.cel, R=42, cx=50, cy=50;
  const t=TEINTES[b.col]||TEINTES["Blanche"];
  const e=ETATS[b.et]||ETATS["Bon (AAA)"];
  const clair=melange(t[0],e.j), sombre=melange(t[1],e.j);
  const rnd=alea(b.cel*7919+13);
  let s=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="g${id}" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="${clair}"/>
      <stop offset="55%" stop-color="${sombre}"/>
      <stop offset="100%" stop-color="${melange(t[1],Math.min(.9,e.j+.35),[60,52,38])}"/>
    </radialGradient>
    <radialGradient id="l${id}" cx="32%" cy="24%" r="30%">
      <stop offset="0%" stop-color="#fff" stop-opacity="${e.lustre}"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    <path id="arc${id}" d="M ${cx-26} ${cy+4} A 26 26 0 0 1 ${cx+26} ${cy+4}" fill="none"/>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#g${id})"/>
  <g clip-path="url(#c${id})">`;

  // alvéoles
  alveoles(R*.97,cx,cy).forEach(a=>{
    const op=.055+.11*(1-a.fore);
    s+=`<ellipse cx="${a.x.toFixed(2)}" cy="${a.y.toFixed(2)}" rx="${a.rx.toFixed(2)}" ry="${a.ry.toFixed(2)}" `+
       `transform="rotate(${a.rot.toFixed(1)} ${a.x.toFixed(2)} ${a.y.toFixed(2)})" `+
       `fill="#000" opacity="${op.toFixed(3)}"/>`;
  });

  // marquages imprimés
  const mq=b.mq||'';
  if(mq.indexOf('Triple Track')>=0){
    s+=`<g opacity=".85"><rect x="${cx-19}" y="${cy-24}" width="38" height="1.6" fill="#1b4fa8"/>`+
       `<rect x="${cx-19}" y="${cy-20.6}" width="38" height="2.4" fill="#c0392b"/>`+
       `<rect x="${cx-19}" y="${cy-16.8}" width="38" height="1.6" fill="#1b4fa8"/></g>`;
  }
  if(b.em && mq.indexOf('Triple Track')<0){
    // emblème du parcours ou de l'organisme, rendu comme une empreinte d'encre
    s+=`<g opacity=".8"><ellipse cx="${cx}" cy="${cy-13}" rx="13" ry="9" fill="none" stroke="#2f4a2c" stroke-width="1.1"/>`+
       `<ellipse cx="${cx}" cy="${cy-13}" rx="8.5" ry="5.5" fill="#2f4a2c" opacity=".22"/>`+
       `<text x="${cx}" y="${cy-11.4}" text-anchor="middle" font-family="ui-sans-serif,system-ui" `+
       `font-size="5" font-weight="700" fill="#2f4a2c" letter-spacing=".3">${(b.em||'').slice(0,3).toUpperCase()}</text></g>`;
  }
  if(b.ma && b.ma!=='Fabricant inconnu'){
    s+=`<text font-family="ui-sans-serif,system-ui" font-size="6.4" font-weight="700" `+
       `letter-spacing=".6" fill="#3a3a3a" opacity=".62">`+
       `<textPath href="#arc${id}" startOffset="50%" text-anchor="middle">`+
       `${(b.ma||'').toUpperCase().slice(0,16)}</textPath></text>`;
  }
  if(b.num){
    s+=`<text x="${cx}" y="${cy+23}" text-anchor="middle" font-family="ui-sans-serif,system-ui" `+
       `font-size="9" font-weight="600" fill="#2f3336" opacity=".7">${b.num}</text>`;
  }

  // usure : éraflures puis entailles
  for(let i=0;i<e.scuff;i++){
    const a=rnd()*Math.PI*2, d=R*(.25+rnd()*.6);
    const x=cx+d*Math.cos(a), y=cy+d*Math.sin(a), L=3+rnd()*7;
    s+=`<path d="M ${x.toFixed(1)} ${y.toFixed(1)} q ${(L/2).toFixed(1)} ${(rnd()*3-1.5).toFixed(1)} ${L.toFixed(1)} 0" `+
       `stroke="#7a6c52" stroke-width="${(.6+rnd()*.6).toFixed(2)}" fill="none" `+
       `opacity=".4" stroke-linecap="round" transform="rotate(${(rnd()*360).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  for(let i=0;i<e.cut;i++){
    const a=rnd()*Math.PI*2, d=R*(.3+rnd()*.55);
    const x=cx+d*Math.cos(a), y=cy+d*Math.sin(a);
    s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(1.4+rnd()*1.6).toFixed(1)}" ry="${(.9+rnd()).toFixed(1)}" `+
       `fill="#6a5c44" opacity=".45" transform="rotate(${(rnd()*360).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }

  // reflet spéculaire et ombre de terminateur
  s+=`<ellipse cx="${cx-12}" cy="${cy-15}" rx="15" ry="11" fill="url(#l${id})" `+
     `transform="rotate(-28 ${cx-12} ${cy-15})"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="1.6"/>`;
  s+=`</g></svg>`;
  return s;
}

/* ---- rendu ---- */
const parCel={}; BALLES.forEach(b=>parCel[b.cel]=b);
const carton=document.getElementById('carton');
for(let i=1;i<=CAPACITE;i++){
  const b=parCel[i], a=document.createElement('div');
  a.className='alv'+(b?'':' vide');
  a.innerHTML='<div class="creux"></div><span class="cellnum">'+i+'</span>';
  if(b){
    const d=document.createElement('div');
    d.className='balle'; d.innerHTML=dessinerBalle(b);
    a.appendChild(d);
    if(b.nat==='Pièce de collection'){
      const h=document.createElement('span'); h.className='halo'; a.appendChild(h);
    }
    a.onclick=()=>ouvrir(b);
  }
  carton.appendChild(a);
}

const liste=document.getElementById('liste');
BALLES.slice().sort((x,y)=>x.cel-y.cel).forEach(b=>{
  const l=document.createElement('div'); l.className='ligne';
  l.innerHTML='<span class="c">'+String(b.cel).padStart(2,'0')+'</span>'+
    '<span class="n">'+(b.nat==='Pièce de collection'?'<span class="pastille"></span>':'')+
    esc(b.k)+'<span class="m">'+esc(b.ma)+' · '+esc(b.et)+
    (b.em?' · '+esc(b.em):'')+'</span></span>'+
    '<span class="v">'+(b.val?b.val.toFixed(2)+' $':'—')+'</span>';
  l.onclick=()=>ouvrir(b);
  liste.appendChild(l);
});

const total=BALLES.reduce((s,b)=>s+(b.val||0),0);
const coll=BALLES.filter(b=>b.nat==='Pièce de collection').length;
const em=new Set(BALLES.filter(b=>b.em).map(b=>b.em)).size;
document.getElementById('eyebrow').textContent='Inventaire — '+BALLES.length+' balles';
document.getElementById('jauge').innerHTML=
  '<b>'+BALLES.length+'</b> balles sur <b>'+CAPACITE+'</b> alvéoles &nbsp;·&nbsp; '+
  '<b>'+coll+'</b> pièces de collection &nbsp;·&nbsp; <b>'+em+'</b> émetteurs distincts'+
  ' &nbsp;·&nbsp; valeur au barème <b>'+total.toFixed(2)+' $</b>';
document.getElementById('pied').innerHTML=
  'Aucune photographie n\u2019a servi : chaque balle est dessinée à partir de quatre champs de la base — couleur, état, marquage, numéro. '+
  'L\u2019alvéolage suit la projection réelle d\u2019une sphère, et le jaunissement comme les éraflures sont calés sur le champ État.<br>'+
  'Les valeurs proviennent du barème automatique (modèle × état) du marché de la balle récupérée. Les balles à logo sont probablement sous-évaluées : elles relèvent d\u2019un autre marché.';

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ligne(t,v){return v?'<dt>'+t+'</dt><dd>'+esc(v)+'</dd>':'';}
function ouvrir(b){
  document.getElementById('fiche').innerHTML=
    '<div class="portrait">'+dessinerBalle(b)+'</div>'+
    '<div><h2>'+esc(b.k)+'</h2><div class="adr">C-01-'+String(b.cel).padStart(2,'0')+'</div></div>'+
    '<dl>'+ligne('Nature',b.nat)+ligne('Marque',b.ma)+ligne('Modèle',b.md)+
    ligne('Numéro',b.num)+ligne('Couleur',b.col)+ligne('État',b.et)+
    ligne('Marquage',b.mq)+ligne('Émetteur',b.em)+
    ligne('Valeur',(b.val?b.val.toFixed(2)+' $':'non évaluée'))+
    ligne('Source',b.src)+'</dl>'+
    (b.no?'<div class="note">'+esc(b.no)+'</div>':'')+
    '<button onclick="fermer()">Fermer</button>';
  document.getElementById('voile').classList.add('on');
}
function fermer(){document.getElementById('voile').classList.remove('on');}
document.getElementById('voile').onclick=e=>{if(e.target.id==='voile')fermer();};
document.onkeydown=e=>{if(e.key==='Escape')fermer();};
</script>
</body>
</html>
