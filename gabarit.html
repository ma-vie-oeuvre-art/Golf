<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection de balles de golf</title>
<style>
:root{
  --fond:#12140f; --carton:#c8b189; --carton-b:#a68f6a; --creux:#8d7854;
  --texte:#f2efe6; --doux:#a8a294; --trait:#2b2e25; --accent:#c9a227;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fond);color:var(--texte);
  font:16px/1.55 ui-serif,Georgia,"Times New Roman",serif;
  padding:32px 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto}
.eyebrow{font:500 11px/1 ui-sans-serif,system-ui;letter-spacing:.18em;
  text-transform:uppercase;color:var(--doux);margin-bottom:10px}
h1{font-size:34px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.sous{color:var(--doux);font-size:15px;margin-bottom:28px}
.jauge{font:500 12px/1 ui-sans-serif,system-ui;letter-spacing:.06em;
  color:var(--doux);border-top:1px solid var(--trait);
  border-bottom:1px solid var(--trait);padding:12px 0;margin-bottom:30px}
.jauge b{color:var(--texte);font-weight:600}

.carton{background:linear-gradient(#d6c09a,#bda682);border-radius:12px;
  padding:22px;box-shadow:0 18px 40px #0009,inset 0 1px 0 #fff6;
  display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.alv{aspect-ratio:1;background:radial-gradient(circle at 50% 45%,
  var(--creux) 0%,var(--carton-b) 68%,#00000000 69%);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;transition:transform .12s}
.alv:hover{transform:translateY(-3px)}
.alv.vide{cursor:default}
.alv.vide:hover{transform:none}
.bille{width:76%;aspect-ratio:1;border-radius:50%;position:relative;
  box-shadow:0 4px 10px #0006, inset -5px -7px 12px #00000026, inset 4px 5px 10px #ffffff55;
  background-image:radial-gradient(#00000012 21%,#0000 22%);
  background-size:7px 7px}
.num{position:absolute;bottom:14%;left:0;right:0;text-align:center;
  font:600 9px/1 ui-sans-serif,system-ui;color:#2b2b2b;opacity:.65}
.tt{position:absolute;top:18%;left:50%;transform:translateX(-50%);
  width:46%;height:2px;background:#1e4fa8;box-shadow:0 4px 0 #1e4fa8,0 8px 0 #c0392b}
.cellnum{position:absolute;top:-2px;left:-2px;font:600 9px/1 ui-sans-serif,system-ui;
  color:#6b5a3e}
.coll::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--accent);opacity:.75}

.liste{margin-top:44px;border-top:1px solid var(--trait)}
.ligne{display:grid;grid-template-columns:34px 1fr auto;gap:14px;
  padding:14px 4px;border-bottom:1px solid var(--trait);cursor:pointer;
  align-items:baseline}
.ligne:hover{background:#ffffff08}
.ligne .c{color:var(--doux);font:600 12px/1.4 ui-sans-serif,system-ui}
.ligne .n{font-size:16px}
.ligne .m{display:block;color:var(--doux);font-size:13px;margin-top:2px}
.ligne .v{color:var(--doux);font:500 13px/1 ui-sans-serif,system-ui;white-space:nowrap}

.voile{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.voile.on{display:flex}
.fiche{background:#1b1e18;border:1px solid var(--trait);border-radius:12px;
  max-width:520px;width:100%;padding:28px;max-height:86vh;overflow:auto}
.fiche h2{font-size:22px;margin-bottom:4px}
.fiche .adr{font:500 11px/1 ui-sans-serif,system-ui;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.fiche dl{display:grid;grid-template-columns:120px 1fr;gap:8px 16px;font-size:14px}
.fiche dt{color:var(--doux);font:500 12px/1.5 ui-sans-serif,system-ui}
.fiche .note{margin-top:18px;padding-top:16px;border-top:1px solid var(--trait);
  font-size:14px;color:#ddd8cc}
.fiche button{margin-top:22px;background:none;border:1px solid var(--trait);
  color:var(--doux);padding:8px 16px;border-radius:6px;cursor:pointer;
  font:500 13px ui-sans-serif,system-ui}
.fiche button:hover{color:var(--texte);border-color:var(--doux)}
footer{margin-top:56px;color:var(--doux);font-size:12px;
  font-family:ui-sans-serif,system-ui}
@media(max-width:620px){
  .carton{grid-template-columns:repeat(3,1fr)}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <h1>Collection de balles de golf</h1>
  <p class="sous">Carton C-01 — premier contenant inventorié</p>
  <div class="jauge" id="jauge"></div>
  <div class="carton" id="carton"></div>
  <div class="liste" id="liste"></div>
  <footer id="pied"></footer>
</div>
<div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>
<script>
const BALLES = /*__DONNEES__*/[]/*__FIN__*/;
const CAPACITE = 12;
const TEINTES = {
  "Blanche":["#fdfdfb","#e6e4dc"], "Jaune":["#f5e15c","#dcc23a"],
  "Verte":["#7fd68a","#57b466"], "Orange":["#f5a45c","#dd8438"],
  "Rose":["#f5a0be","#dd7ea1"], "Rouge":["#e97060","#cf5040"]
};
const JAUNI = {"Neuve sous emballage":0,"Comme neuve (AAAAA)":.04,
  "Très bon (AAAA)":.09,"Bon (AAA)":.16,"Correct (AA)":.24,
  "Usagée (A)":.34,"Endommagée":.42};

const parCel = {};
BALLES.forEach(b=>parCel[b.cel]=b);

function melange(hex,t){ // vers ivoire
  const c=hex.replace('#',''), r=parseInt(c.substr(0,2),16),
    g=parseInt(c.substr(2,2),16), bl=parseInt(c.substr(4,2),16);
  const m=(x,y)=>Math.round(x+(y-x)*t);
  return `rgb(${m(r,222)},${m(g,200)},${m(bl,150)})`;
}

const carton=document.getElementById('carton');
for(let i=1;i<=CAPACITE;i++){
  const b=parCel[i];
  const a=document.createElement('div');
  a.className='alv'+(b?'':' vide');
  a.innerHTML='<span class="cellnum">'+i+'</span>';
  if(b){
    const t=TEINTES[b.col]||TEINTES["Blanche"];
    const usure=JAUNI[b.et]!==undefined?JAUNI[b.et]:.2;
    const bille=document.createElement('div');
    bille.className='bille'+(b.nat==='Pièce de collection'?' coll':'');
    bille.style.background=
      'radial-gradient(#00000012 21%,#0000 22%),'+
      'radial-gradient(circle at 34% 30%,'+melange(t[0],usure)+','+melange(t[1],usure)+')';
    bille.style.backgroundSize='7px 7px, cover';
    if(b.num) bille.innerHTML='<span class="num">'+b.num+'</span>';
    if((b.mq||'').indexOf('Triple Track')>=0)
      bille.innerHTML+='<span class="tt"></span>';
    a.appendChild(bille);
    a.onclick=()=>ouvrir(b);
  }
  carton.appendChild(a);
}

const liste=document.getElementById('liste');
BALLES.slice().sort((x,y)=>x.cel-y.cel).forEach(b=>{
  const l=document.createElement('div');
  l.className='ligne';
  l.innerHTML='<span class="c">'+String(b.cel).padStart(2,'0')+'</span>'+
    '<span class="n">'+esc(b.k)+'<span class="m">'+esc(b.ma)+' · '+esc(b.et)+
    (b.em?' · '+esc(b.em):'')+'</span></span>'+
    '<span class="v">'+(b.val?b.val.toFixed(2)+' $':'—')+'</span>';
  l.onclick=()=>ouvrir(b);
  liste.appendChild(l);
});

const total=BALLES.reduce((s,b)=>s+(b.val||0),0);
const coll=BALLES.filter(b=>b.nat==='Pièce de collection').length;
const emetteurs=new Set(BALLES.filter(b=>b.em).map(b=>b.em)).size;
document.getElementById('eyebrow').textContent='Inventaire — '+BALLES.length+' balles';
document.getElementById('jauge').innerHTML=
  '<b>'+BALLES.length+'</b> balles sur <b>'+CAPACITE+'</b> alvéoles &nbsp;·&nbsp; '+
  '<b>'+coll+'</b> pièces de collection &nbsp;·&nbsp; '+
  '<b>'+emetteurs+'</b> émetteurs distincts &nbsp;·&nbsp; '+
  'valeur au barème <b>'+total.toFixed(2)+' $</b>';
document.getElementById('pied').textContent=
  'Les valeurs proviennent du barème automatique (modèle × état) du marché de la balle récupérée. Les balles à logo sont probablement sous-évaluées : elles relèvent d\u2019un autre marché.';

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ligne(t,v){return v?'<dt>'+t+'</dt><dd>'+esc(v)+'</dd>':'';}
function ouvrir(b){
  document.getElementById('fiche').innerHTML=
    '<h2>'+esc(b.k)+'</h2><div class="adr">C-01-'+String(b.cel).padStart(2,'0')+'</div>'+
    '<dl>'+ligne('Nature',b.nat)+ligne('Marque',b.ma)+ligne('Modèle',b.md)+
    ligne('Numéro',b.num)+ligne('Couleur',b.col)+ligne('État',b.et)+
    ligne('Marquage',b.mq)+ligne('Émetteur',b.em)+
    ligne('Valeur',(b.val?b.val.toFixed(2)+' $':'non évaluée'))+
    ligne('Source',b.src)+'</dl>'+
    (b.no?'<div class="note">'+esc(b.no)+'</div>':'')+
    '<button onclick="fermer()">Fermer</button>';
  document.getElementById('voile').classList.add('on');
}
function fermer(){document.getElementById('voile').classList.remove('on');}
document.getElementById('voile').onclick=e=>{if(e.target.id==='voile')fermer();};
document.onkeydown=e=>{if(e.key==='Escape')fermer();};
</script>
</body>
</html>
