<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le carton — collection de balles de golf</title>
<style>
:root{
  --noir:#14100D; --caisse:#1F1813; --carton:#2B221B;
  --papier:#EFE7D9; --poussiere:#94897A; --or:#E8B93A; --sillon:#0B0908;
  --pulpe:#C8B189; --pulpe-f:#A68F6A; --creux:#8D7854;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--noir);color:var(--papier);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% -10%, rgba(232,185,58,.07), transparent 60%)}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:36px 24px 80px}

header{border-bottom:1px solid rgba(239,231,217,.14);padding-bottom:22px;margin-bottom:26px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--poussiere);margin:0 0 10px}
h1{font-size:clamp(34px,6vw,60px);line-height:.95;margin:0;font-weight:400;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--or)}
.sous{margin:12px 0 0;color:var(--poussiere);font-size:15px;max-width:60ch;line-height:1.5}

.outils{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:26px 0 18px}
.champ{position:relative;flex:1 1 260px;max-width:380px}
.champ input{width:100%;background:var(--caisse);border:1px solid rgba(239,231,217,.16);
  color:var(--papier);font-family:var(--serif);font-size:15px;
  padding:11px 14px 11px 36px;border-radius:2px;outline:none}
.champ input::placeholder{color:var(--poussiere)}
.champ input:focus{border-color:var(--or);box-shadow:0 0 0 3px rgba(232,185,58,.16)}
.champ svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.pige{background:var(--or);color:var(--sillon);border:none;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:13px 20px;border-radius:2px;font-weight:600;transition:filter .12s ease}
.pige:hover{filter:brightness(1.1)}
.pige:active{transform:translateY(1px)}
.pige:focus-visible,.puce:focus-visible,.carte:focus-visible,select:focus-visible,
.tourner:focus-visible,.alv:focus-visible{outline:2px solid var(--or);outline-offset:3px}
select{background:var(--caisse);color:var(--papier);border:1px solid rgba(239,231,217,.16);
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:12px 10px;
  border-radius:2px;cursor:pointer;text-transform:uppercase;outline:none}

.rangee{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.etiq{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--poussiere);margin-right:4px;min-width:64px}
.puce{background:transparent;border:1px solid rgba(239,231,217,.2);color:var(--poussiere);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 11px;border-radius:100px;cursor:pointer;transition:all .14s ease}
.puce:hover{border-color:rgba(239,231,217,.5);color:var(--papier)}
.puce[aria-pressed="true"]{background:var(--papier);border-color:var(--papier);color:var(--sillon)}
.puce .n{opacity:.55;margin-left:5px}
.compte{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--poussiere);
  text-transform:uppercase;margin:16px 0 20px}
.compte b{color:var(--papier);font-weight:400}

/* ---- le carton ---- */
.plateau{background:linear-gradient(#D6C09A,#BDA682);border-radius:14px;padding:22px;
  box-shadow:0 22px 46px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.45);
  display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:34px}
.alv{aspect-ratio:1;border:none;padding:0;background:radial-gradient(circle at 50% 45%,
  var(--creux) 0%, var(--pulpe-f) 68%, transparent 69%);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  position:relative;cursor:pointer;transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.alv:hover{transform:translateY(-5px)}
.alv[disabled]{cursor:default}
.alv[disabled]:hover{transform:none}
.alv.pale{opacity:.28;filter:grayscale(.6)}
.cellnum{position:absolute;top:-4px;left:2px;font-family:var(--mono);font-size:10px;
  color:#6B5A3E;letter-spacing:.06em}

.bille{width:78%;aspect-ratio:1;border-radius:50%;position:relative;
  box-shadow:0 5px 12px rgba(0,0,0,.42),
    inset -6px -8px 14px rgba(0,0,0,.16), inset 5px 6px 12px rgba(255,255,255,.34)}
.bille .alveoles{position:absolute;inset:0;border-radius:50%;
  background-image:radial-gradient(rgba(0,0,0,.09) 22%, transparent 23%);
  background-size:8px 8px}
.bille .num{position:absolute;bottom:13%;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:10px;color:#2B2B2B;opacity:.6}
.bille .tt{position:absolute;top:19%;left:50%;transform:translateX(-50%);
  width:48%;height:2px;background:#1E4FA8;box-shadow:0 4px 0 #1E4FA8,0 8px 0 #C0392B}
.bille .marque{position:absolute;top:30%;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:7px;letter-spacing:.06em;color:#3a3a3a;opacity:.55}
.coll::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  border:1.5px solid var(--or);opacity:.8}

/* ---- le mur ---- */
.mur{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.carte{background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit;
  display:flex;flex-direction:column;gap:10px;
  animation:monte .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes monte{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.socle{position:relative;aspect-ratio:1;background:var(--carton);border-radius:1px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 22px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease}
.carte:hover .socle{transform:translateY(-6px) rotate(-1.1deg);box-shadow:0 20px 34px rgba(0,0,0,.62)}
.socle .bille{width:70%}
.adresse{position:absolute;left:0;bottom:0;background:rgba(11,9,8,.82);color:var(--papier);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:4px 7px;backdrop-filter:blur(3px)}
.sceau{position:absolute;right:6px;top:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;color:var(--or);border:1px solid rgba(232,185,58,.5);
  padding:2px 5px;border-radius:100px;text-transform:uppercase}
.legende .t{font-size:14px;line-height:1.3;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legende .a{font-size:12.5px;color:var(--poussiere);margin:3px 0 0;line-height:1.35}
.legende .k{font-family:var(--mono);font-size:10.5px;color:var(--or);opacity:.75;margin:4px 0 0;
  letter-spacing:.04em}

.rien{border:1px dashed rgba(239,231,217,.22);padding:52px 20px;text-align:center;
  color:var(--poussiere)}
.rien p{margin:0 0 6px;font-size:17px;color:var(--papier)}
.rien span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ---- fiche ---- */
.voile{position:fixed;inset:0;background:rgba(8,6,5,.9);backdrop-filter:blur(7px);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
.voile.on{display:flex}
.fiche{background:var(--caisse);border:1px solid rgba(239,231,217,.14);
  max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:30px;position:relative;
  animation:monte .3s cubic-bezier(.2,.7,.3,1) both}
.fermer{position:absolute;right:16px;top:12px;background:none;border:none;color:var(--poussiere);
  font-size:26px;line-height:1;cursor:pointer}
.fermer:hover{color:var(--papier)}
.fiche .adr{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--or);margin:0 0 8px}
.fiche h2{font-size:26px;font-weight:400;margin:0 0 4px;line-height:1.15}
.fiche .st{color:var(--poussiere);font-size:14px;margin:0 0 20px}
.scene{perspective:1000px;margin:0 auto 20px;width:190px;height:190px}
.pivot{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);
  transform-style:preserve-3d}
.pivot.dos{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;
  align-items:center;justify-content:center}
.face.arriere{transform:rotateY(180deg);background:var(--carton);border-radius:50%;
  flex-direction:column;gap:6px;padding:22px;text-align:center}
.face.arriere .m{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--papier);line-height:1.6}
.face.arriere .l{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--poussiere)}
.tourner{display:block;margin:0 auto 22px;background:transparent;border:1px solid rgba(239,231,217,.24);
  color:var(--poussiere);font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;padding:8px 16px;border-radius:2px;cursor:pointer}
.tourner:hover{color:var(--papier);border-color:var(--papier)}
dl{display:grid;grid-template-columns:130px 1fr;gap:9px 18px;margin:0;font-size:14.5px}
dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--poussiere);padding-top:3px}
dd{margin:0}
.note{margin-top:20px;padding-top:18px;border-top:1px solid rgba(239,231,217,.14);
  font-size:14.5px;line-height:1.6;color:#DDD6C6;white-space:pre-line}
footer{margin-top:60px;padding-top:22px;border-top:1px solid rgba(239,231,217,.14);
  color:var(--poussiere);font-size:13px;line-height:1.6;max-width:70ch}
@media(max-width:760px){
  .plateau{grid-template-columns:repeat(3,1fr)}
  dl{grid-template-columns:1fr}
  dt{padding-top:8px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="eyebrow" id="eyebrow">Inventaire</p>
  <h1>Le carton des <em>balles</em></h1>
  <p class="sous" id="sous"></p>
</header>

<div class="outils">
  <div class="champ">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Chercher une balle, une marque, un parcours…" autocomplete="off">
  </div>
  <select id="tri">
    <option value="cel">Ordre des cellules</option>
    <option value="marque">Marque</option>
    <option value="modele">Modèle</option>
    <option value="etat">État, du meilleur</option>
    <option value="valeur">Valeur, de la plus cotée</option>
  </select>
  <button class="pige" id="pige">Pige une balle</button>
</div>

<div class="rangee" id="f-contenant"></div>
<div class="rangee" id="f-nature"></div>
<div class="rangee" id="f-marque"></div>

<p class="compte" id="compte"></p>

<div class="plateau" id="plateau"></div>
<div class="mur" id="mur"></div>
<div class="rien" id="rien" style="display:none">
  <p>Aucune balle ne correspond.</p>
  <span>Efface la recherche ou relâche un filtre.</span>
</div>

<footer id="pied"></footer>
</div>

<div class="voile" id="voile"><div class="fiche" id="fiche"></div></div>

<script>
const BALLES = /*__DONNEES__*/[]/*__FIN__*/;
const TEINTES={"Blanche":["#FDFDFB","#E4E2DA"],"Jaune":["#F5E15C","#DCC23A"],
  "Verte":["#7FD68A","#57B466"],"Orange":["#F5A45C","#DD8438"],
  "Rose":["#F5A0BE","#DD7EA1"],"Rouge":["#E97060","#CF5040"]};
const RANG_ETAT={"Neuve sous emballage":0,"Comme neuve (AAAAA)":1,"Très bon (AAAA)":2,
  "Bon (AAA)":3,"Correct (AA)":4,"Usagée (A)":5,"Endommagée":6};
const JAUNI=[0,.04,.09,.16,.24,.34,.42];

let fContenant="", fNature="", fMarque="", tri="cel", q="";

const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=b=>b.cap||12;
function melange(hex,t){
  const c=hex.replace("#","");
  const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),bl=parseInt(c.substr(4,2),16);
  const m=(x,y)=>Math.round(x+(y-x)*t);
  return `rgb(${m(r,224)},${m(g,203)},${m(bl,154)})`;
}
function billeHTML(b,gros){
  const t=TEINTES[b.col]||TEINTES["Blanche"];
  const u=JAUNI[RANG_ETAT[b.et]!==undefined?RANG_ETAT[b.et]:4];
  const fond=`radial-gradient(circle at 34% 30%, ${melange(t[0],u)}, ${melange(t[1],u)})`;
  let dedans='<span class="alveoles"></span>';
  if(gros&&b.mq&&b.mq.indexOf("Triple Track")<0)
    dedans+='<span class="marque">'+esc((b.ma||"").toUpperCase().slice(0,16))+'</span>';
  if((b.mq||"").indexOf("Triple Track")>=0) dedans+='<span class="tt"></span>';
  if(b.num) dedans+='<span class="num">'+esc(b.num)+'</span>';
  return '<span class="bille'+(b.nat==="Pièce de collection"?" coll":"")+'" style="background:'+fond+'">'+dedans+'</span>';
}
function filtre(){
  const m=q.trim().toLowerCase();
  return BALLES.filter(b=>{
    if(fContenant&&b.bac!==fContenant)return false;
    if(fNature&&b.nat!==fNature)return false;
    if(fMarque&&b.ma!==fMarque)return false;
    if(!m)return true;
    return [b.k,b.ma,b.md,b.mq,b.em,b.no,b.et,b.col].join(" ").toLowerCase().includes(m);
  });
}
function trie(l){
  const c=[...l];
  if(tri==="cel")c.sort((x,y)=>(x.bac+"").localeCompare(y.bac+"")||x.cel-y.cel);
  if(tri==="marque")c.sort((x,y)=>(x.ma||"zzz").localeCompare(y.ma||"zzz","fr")||x.cel-y.cel);
  if(tri==="modele")c.sort((x,y)=>(x.md||"zzz").localeCompare(y.md||"zzz","fr"));
  if(tri==="etat")c.sort((x,y)=>(RANG_ETAT[x.et]??9)-(RANG_ETAT[y.et]??9)||x.cel-y.cel);
  if(tri==="valeur")c.sort((x,y)=>(y.val||0)-(x.val||0));
  return c;
}
function puces(id,champ,valeur,setter,label){
  const el=document.getElementById(id);
  const cpt={};
  BALLES.forEach(b=>{const v=b[champ];if(v)cpt[v]=(cpt[v]||0)+1;});
  const cles=Object.keys(cpt).sort((a,b)=>cpt[b]-cpt[a]||a.localeCompare(b,"fr"));
  if(cles.length<2){el.style.display="none";return;}
  el.innerHTML='<span class="etiq">'+label+'</span>';
  const mk=(txt,val,n)=>{
    const b=document.createElement("button");
    b.className="puce";b.type="button";
    b.setAttribute("aria-pressed",String(valeur()===val));
    b.innerHTML=esc(txt)+(n!=null?'<span class="n">'+n+'</span>':"");
    b.onclick=()=>{setter(valeur()===val?"":val);rendre();};
    el.appendChild(b);
  };
  mk("Tout","",BALLES.length);
  cles.forEach(c=>mk(c,c,cpt[c]));
}
function rendre(){
  puces("f-contenant","bac",()=>fContenant,v=>fContenant=v,"Carton");
  puces("f-nature","nat",()=>fNature,v=>fNature=v,"Nature");
  puces("f-marque","ma",()=>fMarque,v=>fMarque=v,"Marque");

  const vis=trie(filtre());
  const ids=new Set(vis.map(b=>b.bac+"-"+b.cel));

  // plateau : seulement si un seul carton est en jeu
  const bacs=[...new Set(BALLES.map(b=>b.bac))];
  const plateau=document.getElementById("plateau");
  const bacActif=fContenant||(bacs.length===1?bacs[0]:"");
  if(bacActif){
    const dedans=BALLES.filter(b=>b.bac===bacActif);
    const capa=dedans.length?cap(dedans[0]):12;
    const parCel={};dedans.forEach(b=>parCel[b.cel]=b);
    plateau.style.display="grid";
    plateau.innerHTML="";
    for(let i=1;i<=capa;i++){
      const b=parCel[i];
      const a=document.createElement("button");
      a.type="button";a.className="alv";
      if(!b){a.disabled=true;}
      else if(!ids.has(b.bac+"-"+b.cel)){a.classList.add("pale");}
      a.innerHTML='<span class="cellnum">'+i+'</span>'+(b?billeHTML(b,false):"");
      if(b)a.onclick=()=>ouvrir(b);
      plateau.appendChild(a);
    }
  }else plateau.style.display="none";

  const mur=document.getElementById("mur");
  mur.innerHTML="";
  vis.forEach((b,i)=>{
    const c=document.createElement("button");
    c.type="button";c.className="carte";
    c.style.animationDelay=Math.min(i*22,420)+"ms";
    c.innerHTML='<span class="socle">'+billeHTML(b,true)+
      '<span class="adresse">'+esc(b.bac)+'-'+String(b.cel).padStart(2,"0")+'</span>'+
      (b.nat==="Pièce de collection"?'<span class="sceau">collection</span>':"")+'</span>'+
      '<span class="legende"><span class="t">'+esc(b.k)+'</span>'+
      '<span class="a">'+esc(b.ma||"Fabricant inconnu")+' · '+esc(b.et)+'</span>'+
      '<span class="k">'+(b.em?esc(b.em):(b.val?b.val.toFixed(2)+" $":"non évaluée"))+'</span></span>';
    c.onclick=()=>ouvrir(b);
    mur.appendChild(c);
  });
  document.getElementById("rien").style.display=vis.length?"none":"block";
  mur.style.display=vis.length?"grid":"none";

  const val=vis.reduce((s,b)=>s+(b.val||0),0);
  const coll=vis.filter(b=>b.nat==="Pièce de collection").length;
  const em=new Set(vis.filter(b=>b.em).map(b=>b.em)).size;
  document.getElementById("compte").innerHTML=
    "<b>"+vis.length+"</b> balle"+(vis.length>1?"s":"")+
    (vis.length!==BALLES.length?" sur "+BALLES.length:"")+
    " &nbsp;·&nbsp; <b>"+coll+"</b> de collection &nbsp;·&nbsp; <b>"+em+
    "</b> émetteur"+(em>1?"s":"")+" &nbsp;·&nbsp; barème <b>"+val.toFixed(2)+" $</b>";
}
function ouvrir(b){
  const f=document.getElementById("fiche");
  const lg=(t,v)=>v?"<dt>"+t+"</dt><dd>"+esc(v)+"</dd>":"";
  f.innerHTML=
    '<button class="fermer" onclick="fermer()" aria-label="Fermer">&times;</button>'+
    '<p class="adr">'+esc(b.bac)+"-"+String(b.cel).padStart(2,"0")+'</p>'+
    '<h2>'+esc(b.k)+'</h2>'+
    '<p class="st">'+esc(b.nat)+" · "+esc(b.et)+'</p>'+
    '<div class="scene"><div class="pivot" id="pivot">'+
      '<div class="face">'+billeHTML(b,true)+'</div>'+
      '<div class="face arriere">'+
        '<span class="l">Marquage</span>'+
        '<span class="m">'+(b.mq?esc(b.mq):"aucun marquage relevé")+'</span>'+
      '</div></div></div>'+
    '<button class="tourner" onclick="document.getElementById(\'pivot\').classList.toggle(\'dos\')">Retourner</button>'+
    '<dl>'+lg("Marque",b.ma||"inconnue")+lg("Modèle",b.md)+lg("Numéro",b.num)+
      lg("Couleur",b.col)+lg("État",b.et)+lg("Émetteur",b.em)+
      lg("Valeur",b.val?b.val.toFixed(2)+" $":"non évaluée")+lg("Source",b.src)+
      lg("Carton",b.bac)+lg("Cellule",String(b.cel))+'</dl>'+
    (b.no?'<div class="note">'+esc(b.no)+'</div>':"");
  document.getElementById("voile").classList.add("on");
}
function fermer(){document.getElementById("voile").classList.remove("on");}
document.getElementById("voile").onclick=e=>{if(e.target.id==="voile")fermer();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")fermer();});
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;rendre();});
document.getElementById("tri").addEventListener("change",e=>{tri=e.target.value;rendre();});
document.getElementById("pige").onclick=()=>{
  const v=filtre();if(!v.length)return;ouvrir(v[Math.floor(Math.random()*v.length)]);
};

const bacs=[...new Set(BALLES.map(b=>b.bac))];
document.getElementById("eyebrow").textContent=
  "Inventaire — "+BALLES.length+" balles · "+bacs.length+" carton"+(bacs.length>1?"s":"");
document.getElementById("sous").textContent=
  "Chaque balle occupe une cellule numérotée, et cette adresse ne bouge jamais. "+
  "Les balles sont dessinées, pas photographiées : la couleur, le numéro imprimé et "+
